<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Room</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #111827;
        color: #f9fafb;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }

      .panel {
        background: #1f2937;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      }

      h1,
      h2 {
        margin-top: 0;
      }

      .stack {
        display: grid;
        gap: 20px;
      }

      form,
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      label {
        font-weight: 600;
      }

      input,
      select,
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
      }

      input,
      select {
        width: min(100%, 520px);
      }

      button {
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button.secondary {
        background: #374151;
      }

      video {
        width: 100%;
        max-height: 70vh;
        background: black;
        border-radius: 14px;
      }

      .status {
        min-height: 1.5em;
        color: #bfdbfe;
      }

      .hint,
      .detail {
        color: #d1d5db;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 640px) {
        main {
          padding: 14px;
        }

        .panel {
          padding: 16px;
        }

        form,
        .controls {
          align-items: stretch;
        }

        input,
        select,
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="stack">
      <section class="panel">
        <h1>Movie Room</h1>
        <p class="hint">
          Browse the shared movie library, then watch in the browser after entering the shared password.
        </p>
      </section>

      <section id="auth-panel" class="panel">
        <h2>Enter shared password</h2>
        <p id="password-help" class="detail">Sign in before the catalog and playback links are revealed.</p>
        <form id="password-form">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            aria-describedby="password-help login-status"
            required
          />
          <button type="submit">Enter movie room</button>
        </form>
        <p id="login-status" class="status" aria-live="polite"></p>
      </section>

      <section id="library-panel" class="panel" hidden>
        <div class="controls">
          <label for="movie-select">Choose a movie</label>
          <select id="movie-select" disabled></select>
          <button id="reload" type="button">Reload library</button>
          <button id="logout" class="secondary" type="button">Log out</button>
        </div>

        <video
          id="player"
          controls
          preload="auto"
          playsinline
          controlsList="nodownload"
        ></video>
        <p id="status" class="status">Checking session…</p>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
  </html>
